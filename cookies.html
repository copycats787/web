<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Политика cookie — Мастер Галина</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F8F0DF">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&subset=cyrillic&display=swap">
<style>
:root{--t:#673318;--b:#212121;--bg:#F8F0DF;--w:#fff;--serif:Georgia,"Times New Roman",serif;--gold:#e0a100}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Montserrat,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--t);background:var(--bg);line-height:1.65;min-height:100vh;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.wrap{max-width:760px;margin:0 auto;padding:28px 22px 80px}
.back{display:inline-block;text-decoration:none;font-size:14px;margin-bottom:40px;border-bottom:1px solid var(--gold);padding-bottom:2px}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(30px,8vw,46px);line-height:1.1;margin-bottom:28px}
.box{background:var(--w);border-radius:32px;padding:34px 30px;box-shadow:0 12px 36px rgba(103,51,24,.05);min-height:240px;opacity:.9}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/">← На главную</a>
  <h1>Политика использования cookie</h1>
  <div class="box">
    <p>Здесь будет текст.</p>
  </div>
</div>
</body>
</html>
