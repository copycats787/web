<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мастер Галина — Премиальный уход и эстетика</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-page: #FDF4D0;
            --bg-card: #FFFFFF;
            --text-main: #673318;
            --text-dark: #212121;
            --border-line: rgba(103, 51, 24, 0.14);
            --border-card: rgba(103, 51, 24, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: 'Manrope', -apple-system, sans-serif;
            line-height: 1.6;
            letter-spacing: -0.01em;
            padding-bottom: 95px;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Навигация / Хэдер */
        header {
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-line);
            background: rgba(253, 244, 208, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .brand {
            display: flex;
            flex-direction: column;
        }
        .brand-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 24px;
            font-weight: 600;
            line-height: 1;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }
        .brand-tagline {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            margin-top: 4px;
            opacity: 0.75;
            font-weight: 500;
        }
        .city-badge {
            font-size: 11px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 6px 12px;
            border: 1px solid var(--border-line);
            border-radius: 20px;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.5);
        }

        /* =========================================
           1. БЛОК HERO (ЖЕСТКАЯ ФИКСАЦИЯ И 100% ФОТО)
           ========================================= */
        .hero {
            position: relative;
            min-height: 85vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* Прижимаем контент к низу */
            padding-top: 40px;
            padding-bottom: 40px;
            overflow: hidden;
            border-bottom: 1px solid var(--border-line);
            background-color: var(--bg-page);
        }

        /* Рамка строго по ширине контента (480px), центрируем по горизонтали */
        .hero-bg-frame {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px; 
            height: 100%;
            z-index: 0;
        }

        .hero-bg-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top; 
            opacity: 1; /* 100% видимость фото */
        }

        /* Градиент ТОЛЬКО внизу для читаемости текста */
        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom, 
                transparent 0%, 
                transparent 45%, /* До 45% фото вообще не перекрывается градиентом */
                rgba(253, 244, 208, 0.85) 75%, 
                #FDF4D0 100%
            );
            z-index: 1;
            pointer-events: none;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            width: 100%;
        }
        /* ========================================= */

        .section-tag {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.22em;
            opacity: 0.8;
            margin-bottom: 12px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.7);
            padding: 5px 12px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
            border: 1px solid var(--border-card);
        }
        .section-tag::before {
            content: '';
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: var(--text-main);
        }

        .hero h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 38px;
            line-height: 1.15;
            font-weight: 400;
            margin-bottom: 14px;
            color: var(--text-dark);
            text-shadow: 0 1px 1px rgba(255, 255, 255, 0.8);
        }
        .hero h1 em {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-weight: 400;
            color: var(--text-main);
        }
        .hero-desc {
            font-size: 14.5px;
            line-height: 1.6;
            margin-bottom: 22px;
            color: var(--text-main);
            background: rgba(253, 244, 208, 0.6);
            backdrop-filter: blur(6px);
            padding: 10px 14px;
            border-radius: 14px;
            border: 1px solid var(--border-card);
        }

        /* Метрики в Hero */
        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .metric-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border-line);
            border-radius: 16px;
            padding: 14px;
            box-shadow: 0 4px 15px rgba(103, 51, 24, 0.04);
        }
        .metric-card strong {
            font-family: 'Cormorant Garamond', serif;
            font-size: 26px;
            color: var(--text-dark);
            line-height: 1;
            display: block;
            margin-bottom: 4px;
        }
        .metric-card span {
            font-size: 11.5px;
            opacity: 0.85;
            line-height: 1.3;
            display: block;
        }

        /* 2. Бегущая строка (Ticker) */
        .ticker {
            border-bottom: 1px solid var(--border-line);
            padding: 13px 0;
            overflow: hidden;
            white-space: nowrap;
            background: var(--bg-card);
            margin-bottom: 30px;
            display: flex;
        }
        .ticker-inner {
            display: inline-flex;
            gap: 22px;
            animation: tickerScroll 20s linear infinite;
        }
        .ticker-inner span {
            font-size: 11.5px;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            font-weight: 500;
            color: var(--text-dark);
            display: inline-flex;
            align-items: center;
            gap: 20px;
        }
        .ticker-inner i {
            font-style: normal;
            font-family: 'Cormorant Garamond', serif;
            font-size: 15px;
            color: var(--text-main);
        }
        @keyframes tickerScroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* Заголовки разделов */
        .section-header {
            margin-bottom: 22px;
        }
        .section-number {
            font-size: 10px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            opacity: 0.65;
            font-weight: 600;
            margin-bottom: 5px;
            display: block;
        }
        .section-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 29px;
            line-height: 1.2;
            color: var(--text-dark);
            font-weight: 400;
        }
        .section-title em {
            font-style: italic;
            color: var(--text-main);
        }

        /* 3. Блок услуг / Прайс-лист */
        .prices {
            padding: 10px 0 40px;
        }
        .price-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .price-card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 18px;
            padding: 18px 20px;
            box-shadow: 0 4px 15px rgba(103, 51, 24, 0.03);
        }
