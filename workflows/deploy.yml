name: Deploy to GitHub Pages

on:
  # Позволяет запускать деплой вручную кнопкой в интерфейсе GitHub
  workflow_dispatch:
  # Также можно оставить автозапуск при изменении кода в ветке main
  push:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
